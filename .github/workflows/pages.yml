name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install build tools
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          npm ci
      - name: Test Rust and JavaScript
        run: npm test
      - name: Download the verified planet index
        run: |
          read -r checksum archive < datasets/planet-index.sha256
          [[ "$archive" =~ ^planet-areas-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar$ ]]
          curl --fail --location --retry 3 -o "$archive" "https://github.com/regol-gis/regol-live/releases/download/${archive%.tar}/$archive"
          sha256sum -c datasets/planet-index.sha256
          mkdir planet-area-index
          tar -xf "$archive" -C planet-area-index
          rm "$archive"
      - name: Build standalone site
        run: PLANET_AREA_INDEX=planet-area-index npm run build
      - name: Test native and standalone explorers
        run: CHROME_BIN=/usr/bin/google-chrome npm run test:browser
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
