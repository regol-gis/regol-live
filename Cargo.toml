[package]
name = "regol-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
default-run = "regol-live"
description = "Explore a GeoDesk GOL on an interactive map with native viewport queries"
homepage = "https://live.regol.org"
repository = "https://github.com/regol-gis/regol-live"
readme = "README.md"
keywords = ["openstreetmap", "geodesk", "gol", "gis"]
categories = ["science::geo", "command-line-utilities"]
license = "Apache-2.0"
include = ["/build.rs", "/src/**", "/web/**", "/docs/**", "/tests/*.rs", "/tests/fixtures/**", "/LICENSE", "/README.md", "/Cargo.lock"]

[features]
range-reader = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regol = { version = "0.4.0", default-features = false }
regol-overpass = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
regol = { version = "0.4.0", default-features = false, features = ["gob"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
regol = { version = "0.4.0", default-features = false, features = ["mmap"] }
rayon = "1.12"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "sync"] }

[profile.wasm]
inherits = "release"
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
# Keep the engine shared with regol-overpass until the resumable API is released.
regol = { git = "https://github.com/regol-gis/regol.git", rev = "9d9ed5bcbfc0c53384a533f8c3cec2ad082b05b5" }

[workspace]
